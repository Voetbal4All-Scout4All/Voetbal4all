name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Generate static article pages (SSG)
        run: node scripts/generate-article-pages.mjs
        continue-on-error: true

      - name: Copy static share pages to dist
        run: |
          if [ -d share ]; then
            mkdir -p dist/share
            cp -R share/. dist/share/
          else
            echo "[deploy] No share directory to copy"
          fi

      - name: Count SSG output
        run: |
          echo "=== dist/artikel file count ==="
          find dist/artikel -name "index.html" 2>/dev/null | wc -l || echo "0"
          echo "=== dist/ top-level ==="
          ls dist/ | head -20
        continue-on-error: true

      - name: Generate sitemaps + pre-render listing JSON-LD
        run: node scripts/generate-sitemap.mjs

      - name: Copy sitemap files to dist
        run: |
          cp -v sitemap*.xml dist/ 2>/dev/null || echo "[deploy] No sitemap files to copy"
          ls -la dist/sitemap*.xml || echo "[deploy] No sitemap in dist after copy"

      - name: Assert sitemap-index has 3 children
        run: |
          COUNT=$(grep -c '<sitemap>' dist/sitemap-index.xml)
          echo "sitemap-index.xml children: $COUNT"
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::sitemap-index.xml has $COUNT <sitemap> entries, expected 3 (static, articles, news)"
            exit 1
          fi

      - name: Deploy naar gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.voetbal4all.eu
